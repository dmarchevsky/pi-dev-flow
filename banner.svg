<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1280" height="640" rx="18" fill="#0f1216"/>
  <text x="60" y="112" fill="#e6edf3" font-size="46" font-weight="700">dev-flow</text>
  <text x="60" y="156" fill="#8b98a9" font-size="21">enforced feature workflow for pi — one flow, one branch, one worktree per feature</text>

  <!-- gates (checkpoint words the operator answers in chat) -->
  <g fill="none" stroke="#f0b429" stroke-width="2">
    <path d="M 260 236 l 14 14 l -14 14 l -14 -14 z"/>
    <path d="M 500 236 l 14 14 l -14 14 l -14 -14 z"/>
    <path d="M 740 236 l 14 14 l -14 14 l -14 -14 z"/>
    <path d="M 980 236 l 14 14 l -14 14 l -14 -14 z"/>
  </g>
  <g fill="#f0b429" font-size="17" text-anchor="middle">
    <text x="260" y="212">Approve?</text>
    <text x="500" y="212">Verified?</text>
    <text x="740" y="212">Release?</text>
    <text x="980" y="212">Finish?</text>
  </g>

  <!-- stages -->
  <g font-size="19" text-anchor="middle">
    <rect x="60" y="270" width="200" height="62" rx="10" fill="#161b22" stroke="#39424e"/>
    <text x="160" y="308" fill="#e6edf3">plan</text>
    <rect x="300" y="270" width="200" height="62" rx="10" fill="#161b22" stroke="#39424e"/>
    <text x="400" y="308" fill="#e6edf3">implement</text>
    <rect x="540" y="270" width="200" height="62" rx="10" fill="#161b22" stroke="#39424e"/>
    <text x="640" y="308" fill="#e6edf3">pre-release</text>
    <rect x="780" y="270" width="200" height="62" rx="10" fill="#12261f" stroke="#3fb950"/>
    <text x="880" y="308" fill="#7ee2a3">release</text>
    <rect x="1020" y="270" width="200" height="62" rx="10" fill="#161b22" stroke="#39424e"/>
    <text x="1120" y="308" fill="#e6edf3">done</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="#4b5563">
    <line x1="260" y1="301" x2="296" y2="301"/><path d="M 296 301 l -8 -5 v 10 z"/>
    <line x1="500" y1="301" x2="536" y2="301"/><path d="M 536 301 l -8 -5 v 10 z"/>
    <line x1="740" y1="301" x2="776" y2="301"/><path d="M 776 301 l -8 -5 v 10 z"/>
    <line x1="980" y1="301" x2="1016" y2="301"/><path d="M 1016 301 l -8 -5 v 10 z"/>
  </g>

  <text x="60" y="404" fill="#8b98a9" font-size="18">each gate refuses until its exit criteria hold — plan, checks, deploy, changelog, manifest, tag</text>

  <!-- publishing hangs off the release stage: where it goes is the project's playbook, not dev-flow's -->
  <g font-size="17">
    <line x1="880" y1="332" x2="880" y2="444" stroke="#3fb950" stroke-width="2"/>
    <path d="M 880 444 l -5 -8 h 10 z" fill="#3fb950"/>
    <rect x="620" y="452" width="600" height="82" rx="10" fill="#12261f" stroke="#3fb950"/>
    <text x="920" y="484" fill="#7ee2a3" text-anchor="middle">the release ships: registry · image · release page</text>
    <text x="920" y="512" fill="#8b98a9" text-anchor="middle" font-size="15">release-done refuses to close while the artifact is missing</text>
  </g>

  <text x="60" y="576" fill="#5b6672" font-size="16">.dev-flow/&lt;slug&gt;/ — plan, state, worktree · guards keep edits inside the feature</text>
</svg>
